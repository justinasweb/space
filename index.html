<!doctype html>
<html lang="en" data-theme="space">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Justinas · Born from white</title>
<meta name="description" content="WebGL pieces by Justinas. Born from white: a solar system forms out of an empty white page.">
<meta property="og:title" content="Justinas · Born from white">
<meta property="og:description" content="WebGL pieces by Justinas. Born from white: a solar system forms out of an empty white page.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* The page is pure white before any script runs: the first frame of the piece. */
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: #ffffff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; outline: none;
  }

  /* No WebGL: stay white for a moment, then fade to a calm, static dark sky. */
  #fallback {
    position: fixed; inset: 0; opacity: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 46%, rgba(255, 214, 160, 0.10), rgba(255, 190, 130, 0.025) 45%, transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, #0a0b10, #040407 70%, #020203);
    transition: opacity 4s ease 1s;
  }
  body.fallback #stage { display: none; }
  body.fallback #fallback { opacity: 1; }

</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" aria-hidden="true"></div>
<noscript><style>#fallback { opacity: 1 }</style></noscript>
<!-- If the module itself cannot load (very old browser), still fall back gracefully. -->
<script nomodule>document.body.className += ' fallback';</script>
<script type="module" src="/src/pieces/born-from-white.js"></script>
</body>
</html>
