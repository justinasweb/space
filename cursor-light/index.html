<style>
  /* The page without WebGL *is* the fallback: a calm, static dark field with the text.
     When WebGL starts, the canvas simply covers it. */
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse 60% 50% at 62% 38%, rgba(255, 236, 214, 0.045), transparent 70%),
      radial-gradient(ellipse 120% 90% at 20% 110%, rgba(70, 90, 140, 0.06), transparent 60%),
      #010103;
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  canvas#space {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block;
    cursor: none;            /* the sun replaces the cursor */
    touch-action: none;      /* dragging moves the sun instead of scrolling */
    -webkit-tap-highlight-color: transparent;
  }
</style>
