<!doctype html>
<html lang="en" data-theme="space">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020308">
<title>Aurora · Justinas</title>
<meta name="description" content="Hold to stir the northern lights over a frozen lake. A WebGL piece by Justinas.">
<meta property="og:title" content="Aurora · Justinas">
<meta property="og:description" content="Hold to stir the northern lights over a frozen lake. A WebGL piece by Justinas.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #020308; overflow: hidden; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0;
    transition: opacity 2.4s ease;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; outline: none;
  }
  body.live #stage { opacity: 1; }

  /* No WebGL: a still of the same night. */
  #fallback {
    position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 3s ease;
    background:
      radial-gradient(ellipse 70% 18% at 45% 52%, rgba(40, 255, 130, 0.10), transparent 70%),
      radial-gradient(ellipse 50% 30% at 55% 38%, rgba(60, 220, 140, 0.05), transparent 70%),
      linear-gradient(to bottom, #010207 0%, #03060d 60%, #050a10 64%, #020308 100%);
  }
  body.fallback #stage { display: none; }
  body.fallback #fallback { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" aria-hidden="true"></div>
<noscript><style>#fallback { opacity: 1 }</style></noscript>
<!-- If the module itself cannot load (very old browser), still fall back gracefully. -->
<script nomodule>document.body.className += ' fallback';</script>
<script type="module" src="/src/pieces/aurora.js"></script>
</body>
</html>
