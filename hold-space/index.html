<!doctype html>
<html lang="en" data-theme="space">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020203">
<title>Hold space · Justinas</title>
<meta name="description" content="Hold to fly between the stars, let go to arrive somewhere new. A WebGL piece by Justinas.">
<meta property="og:title" content="Hold space · Justinas">
<meta property="og:description" content="Hold to fly between the stars, let go to arrive somewhere new. A WebGL piece by Justinas.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #020203; overflow: hidden; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0;
    transition: opacity 1.6s ease;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; outline: none;
  }
  body.live #stage { opacity: 1; }

  /* No WebGL: a calm static dark sky with the text. */
  #fallback {
    position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 3s ease;
    background:
      radial-gradient(ellipse 70% 22% at 58% 38%, rgba(150, 170, 255, 0.055), transparent 70%),
      radial-gradient(ellipse 30% 30% at 66% 42%, rgba(255, 214, 170, 0.07), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, #08090e, #040407 70%, #020203);
  }
  body.fallback #stage { display: none; }
  body.fallback #fallback { opacity: 1; }

</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" aria-hidden="true"></div>
<noscript><style>#fallback { opacity: 1 }</style></noscript>
<!-- If the module itself cannot load (very old browser), still fall back gracefully. -->
<script nomodule>document.body.className += ' fallback';</script>
<script type="module" src="/src/pieces/hold-space.js"></script>
</body>
</html>
